<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courier Inbox — Markdown Rendering</title>
    <style>
      /* The inbox sizes to its container, so the chain from <html> down to the
         mount point has to have a height for it to fill the viewport. */
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
